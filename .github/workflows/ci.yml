name: Noodle Nova CI/CD

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  frontend-ci:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test

      - name: Build Next.js application
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/noodlenova' }}
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          NEXT_PUBLIC_DELIVERY_ESCROW_CONTRACT_ID: CBEXVMRWS6DG7QRMRS5WBBHYME5UUY4L3ZZ6IUTTERQHBGHBY7B5MDXE

  smart-contract-ci:
    name: Soroban Smart Contract Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/delivery_escrow
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify contract folder structure
        run: |
          test -d .
          test -f Cargo.toml
          test -f src/lib.rs
          test -f src/test.rs

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none, wasm32-unknown-unknown

      - name: Check Rust formatting (cargo fmt)
        run: cargo fmt -- --check

      - name: Lint contract (cargo clippy)
        run: cargo clippy --all-targets -- -D warnings -A deprecated

      - name: Run contract unit tests (cargo test)
        run: cargo test

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v27.1.0

      - name: Build deployable Soroban WASM (stellar contract build)
        run: stellar contract build

  deploy-contract:
    name: Deploy Soroban Contract (CD)
    needs: [smart-contract-ci]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/delivery_escrow
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none, wasm32-unknown-unknown

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v27.1.0

      - name: Build and Deploy Soroban Contract to Stellar Testnet
        env:
          STELLAR_DEPLOYER_SECRET: ${{ secrets.STELLAR_DEPLOYER_SECRET }}
        run: |
          set -euo pipefail
          test -n "$STELLAR_DEPLOYER_SECRET" || {
            echo "Missing required repository secret: STELLAR_DEPLOYER_SECRET" >&2
            exit 1
          }
          cargo rustc --manifest-path=Cargo.toml --crate-type=cdylib --target=wasm32v1-none --release
          CONTRACT_ID="$(stellar contract deploy \
            --wasm target/wasm32v1-none/release/delivery_escrow.wasm \
            --source-account "$STELLAR_DEPLOYER_SECRET" \
            --network testnet)"
          printf '%s\n' "$CONTRACT_ID" | grep -E '^C[A-Z2-7]{55}$'
          echo "### Stellar Testnet contract deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$CONTRACT_ID\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-frontend:
    name: Deploy Frontend to Vercel (CD)
    needs: [frontend-ci, smart-contract-ci]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "Missing required repository secret: VERCEL_TOKEN" >&2; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing required repository secret: VERCEL_ORG_ID" >&2; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing required repository secret: VERCEL_PROJECT_ID" >&2; exit 1; }
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
