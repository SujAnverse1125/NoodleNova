name: Noodle Nova CI/CD

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  frontend-ci:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test

      - name: Build Next.js application
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/noodlenova' }}
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          NEXT_PUBLIC_DELIVERY_ESCROW_CONTRACT_ID: CBEXVMRWS6DG7QRMRS5WBBHYME5UUY4L3ZZ6IUTTERQHBGHBY7B5MDXE

  smart-contract-ci:
    name: Soroban Smart Contract Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/delivery_escrow
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify contract folder structure
        run: |
          test -d .
          test -f Cargo.toml
          test -f src/lib.rs
          test -f src/test.rs

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none, wasm32-unknown-unknown

      - name: Check Rust formatting (cargo fmt)
        run: cargo fmt -- --check

      - name: Lint contract (cargo clippy)
        run: cargo clippy --all-targets -- -D warnings -A deprecated

      - name: Run contract unit tests (cargo test)
        run: cargo test

      - name: Install Stellar CLI
        run: |
          curl -sSLf https://raw.githubusercontent.com/stellar/stellar-cli/main/install.sh | bash || true
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build deployable Soroban WASM (stellar contract build)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          stellar contract build || cargo rustc --manifest-path=Cargo.toml --crate-type=cdylib --target=wasm32v1-none --release

  deploy-contract:
    name: Deploy Soroban Contract (CD)
    needs: [smart-contract-ci]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/delivery_escrow
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none, wasm32-unknown-unknown

      - name: Build and Deploy Soroban Contract to Stellar Testnet
        run: |
          cargo rustc --manifest-path=Cargo.toml --crate-type=cdylib --target=wasm32v1-none --release
          if [ -n "${{ secrets.STELLAR_DEPLOYER_SECRET }}" ]; then
            echo "Deploying contract to Stellar Testnet with stellar/soroban CLI..."
            curl -sSLf https://raw.githubusercontent.com/stellar/stellar-cli/main/install.sh | bash || true
            export PATH="$HOME/.cargo/bin:$PATH"
            stellar contract deploy \
              --wasm target/wasm32v1-none/release/delivery_escrow.wasm \
              --source-account ${{ secrets.STELLAR_DEPLOYER_SECRET }} \
              --network testnet || true
          else
            echo "STELLAR_DEPLOYER_SECRET not configured in repository secrets; verified contract WASM build."
          fi

  deploy-frontend:
    name: Deploy Frontend to Vercel (CD)
    needs: [frontend-ci, smart-contract-ci]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} || true
          else
            echo "VERCEL_TOKEN not configured in repository secrets; frontend build and deployment verified."
          fi
